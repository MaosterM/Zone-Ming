    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2" />

    <style>
      html { background: #07060d; }
    </style>
    <script>
      // Restores a deep link that public/404.html passed along as a query, and drops the
      // trailing slash GitHub Pages can add, so each page has one address.
      ;(function (l) {
        if (l.search[1] !== '/') {
          if (l.pathname !== '%BASE_URL%' && /[^/]\/$/.test(l.pathname)) {
            window.history.replaceState(null, '', l.pathname.slice(0, -1) + l.search + l.hash)
          }
          return
        }
        var path = l.search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + path + l.hash)
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
