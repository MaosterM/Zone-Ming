<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting</title>
    <script>
      // GitHub Pages answers a deep link like /Zone-Ming/work with this file.
      // It sends the path to index.html as a query, and the script there restores
      // the real URL before React Router starts.
      var segmentsToKeep = 1 // the repo name in /Zone-Ming/
      var l = window.location
      l.replace(
        l.protocol + '//' + l.host +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
